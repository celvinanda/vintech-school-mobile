name: Build iOS IPA

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (e.g. 1, 2, ...)'
        required: false
        default: '1'

jobs:
  build:
    name: Build iOS IPA (.ipa)
    runs-on: macos-14 # Apple Silicon M1/M2 macOS runner
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code & Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build iOS App (Unsigned for Sideloading / Ad-hoc)
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          flutter build ios --release --no-codesign --build-number=$BUILD_NUM

      - name: Package Payload into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 VintechSchool.ipa Payload
          ls -la VintechSchool.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VintechSchool-iOS-v${{ github.event.inputs.build_number || github.run_number }}
          path: VintechSchool.ipa
          retention-days: 14

      - name: Create GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VintechSchool.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
